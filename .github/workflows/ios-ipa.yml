name: Build TKO iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate

      - name: Build iOS
        run: |
          xcodebuild \
            -project TKO.xcodeproj \
            -scheme TKO \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/TKO.app build/Payload/
          cd build
          zip -r TKO-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TKO-iOS-unsigned-IPA
          path: build/TKO-unsigned.ipa
