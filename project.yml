
name: TKO

options:
  bundleIdPrefix: com.tinwinko
  deploymentTarget:
    iOS: "16.0"

targets:
  TKO:
    type: application
    platform: iOS

    sources:
      - path: TKO/App

    resources:
      - path: TKO/WebApp/index.html
      - path: TKO/WebApp/script.js
      - path: TKO/WebApp/style.css
      - path: TKO/WebApp/night-background.png

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinwinko.tko.ios
        PRODUCT_NAME: TKO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: TKO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
